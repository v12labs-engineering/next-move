server {
    listen 3302;
    client_max_body_size 50m;
    large_client_header_buffers 4 32k;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 3302;

    # The local gateway exposes only the Supabase paths and app UI.
    location ^~ /.well-known/workflow/ { return 404; }
    location ^~ /api/local-restore-test { return 404; }

    location /auth/v1/ { proxy_pass http://auth:9999/; }
    location /rest/v1/ {
        # PostgREST can echo catalogue batches of listing IDs in Content-Location.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_pass http://rest:3000/;
    }
    location /storage/v1/ { proxy_pass http://storage:5000/; }

    location = /api/profile/analyze {
        # Allow the local model to finish before the gateway times out.
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect http://127.0.0.1:3000/ http://127.0.0.1:3302/;
        proxy_redirect http://localhost:3000/ http://127.0.0.1:3302/;
    }
}
